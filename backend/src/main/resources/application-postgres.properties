# PostgreSQL DataSource configuration reading from environment variables
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# HikariCP connection pool settings for Neon serverless PostgreSQL
# Neon scales compute to zero after 5 minutes of inactivity.
# max-lifetime is set shorter than Neon's 5-minute cutoff to retire idle connections before Neon closes the socket.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.max-lifetime=240000
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.keepalive-time=120000

# Enable multi-row batch rewrite for PostgreSQL JDBC to speed up bulk inserts
spring.datasource.hikari.data-source-properties.reWriteBatchedInserts=true

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
