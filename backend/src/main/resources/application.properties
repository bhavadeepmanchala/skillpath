spring.application.name=backend
spring.profiles.include=secrets

# Datasource configuration with H2 fallback
spring.datasource.url=${DB_URL:jdbc:h2:mem:skillpath;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true

# Trends
skillpath.trends.min-postings=20

# Alignment
skillpath.alignment.window-months=3
skillpath.alignment.top-n-skills=15

# Flags
skillpath.flags.window-months=12
skillpath.flags.openings-scaling-factor=1.0
skillpath.flags.oversupply-ratio-threshold=1.5
# pairs with fewer estimated openings are too small to judge; same idea as skillpath.trends.min-postings
skillpath.flags.min-openings=20

